# Gradle daemon 堆内存（R8 跑在 daemon 内，这是关键）
# 5g 堆 + workers.max=1 使 R8/javac 串行，避免多 ABI 构建 OOM
# 内存配置唯一权威：gradle.properties，workflow 不注入 GRADLE_OPTS
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=1
android.r8.maxWorkers=1