name: Customize & Build APK

on:
  workflow_dispatch:

jobs:
  customize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Run local_customize.py
        run: python local_customize.py

      - name: Commit customized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto: apply cat icon customization"
          git push

  build:
    needs: customize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleMobileArm64_v8aRelease assembleLeanbackArm64_v8aRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/**/*Release*.apk
